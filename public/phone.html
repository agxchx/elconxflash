<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orquesta Dm11 - Teléfono</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
        }
        .btn-main {
            padding: 20px 35px;
            font-size: 20px;
            background-color: #ef4444;
            color: #ffffff;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            margin-bottom: 15px;
        }
        .btn-test {
            padding: 12px 25px;
            font-size: 16px;
            background-color: #3b82f6;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            display: none;
            margin-top: 15px;
        }
        #info {
            margin-top: 20px;
            font-size: 28px;
            color: #38bdf8;
            font-weight: bold;
        }
        #debug {
            margin-top: 10px;
            font-size: 18px;
            color: #fbbf24;
        }
        #log {
            margin-top: 15px;
            font-size: 16px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div>
        <h2>Orquesta Web Dm11</h2>
        <button id="start" class="btn-main">1. TOCA AQUÍ PARA ACTIVAR</button>
        <div id="info">Nota asignada: ?</div>
        <div id="debug">Último MIDI recibido: Ninguno</div>
        <button id="test-sound" class="btn-test">🎵 Tocar mi nota de prueba</button>
        <p id="log">Esperando activación de audio...</p>
    </div>

    <script>
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}`);
        const log = document.getElementById('log');
        const info = document.getElementById('info');
        const debug = document.getElementById('debug');
        const testBtn = document.getElementById('test-sound');

        // Notas del acorde Dm11 con sus números MIDI reales
        const dm11Notes = [50, 53, 57, 60, 62, 65, 69, 72, 79];
        const assignedMidiNote = dm11Notes[Math.floor(Math.random() * dm11Notes.length)];

        function midiToNoteName(midiNumber) {
            const notes = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
            const octave = Math.floor(midiNumber / 12) - 1;
            return notes[midiNumber % 12] + octave;
        }

        const assignedNoteString = midiToNoteName(assignedMidiNote);
        info.innerText = `Tu Nota: ${assignedNoteString} (MIDI: ${assignedMidiNote})`;

        let synth;
        let audioInitialized = false;

        function playAssignedNote() {
            if (audioInitialized && synth) {
                synth.triggerAttackRelease(assignedNoteString, "4n");
                log.innerText = `¡Sonó tu nota (${assignedNoteString})!`;
                setTimeout(() => {
                    log.innerText = "Conectado. Esperando tu tecla MIDI...";
                }, 400);
            }
        }

        // 1. Activar motor de audio con el botón rojo
        document.getElementById('start').addEventListener('click', async () => {
            await Tone.start();
            
            synth = new Tone.FMSynth({
                harmonicity: 1.5,
                modulationIndex: 1.2,
                oscillator: { type: "triangle" },
                envelope: { attack: 0.01, decay: 0.5, sustain: 0, release: 0.5 },
                modulation: { type: "square" },
                modulationEnvelope: { attack: 0.01, decay: 0.3, sustain: 0, release: 0.3 }
            }).toDestination();

            audioInitialized = true;
            
            const btn = document.getElementById('start');
            btn.style.backgroundColor = "#22c55e";
            btn.innerText = "¡AUDIO ACTIVO!";
            btn.disabled = true;
            
            testBtn.style.display = "inline-block";
            log.innerText = "Audio desbloqueado. ¡Listo para tu teclado MIDI!";
            
            playAssignedNote();
        });

        testBtn.addEventListener('click', () => {
            playAssignedNote();
        });

        // 2. Recepción universal compatible con Blobs y textos de red
        ws.onmessage = async (event) => {
            try {
                let incomingNote = null;

                // Manejo seguro por si event.data llega como Blob o texto plano
                if (event.data instanceof Blob) {
                    incomingNote = await event.data.text();
                } else {
                    incomingNote = String(event.data);
                }

                incomingNote = incomingNote.trim();

                debug.innerText = `Último MIDI recibido: ${incomingNote}`;

                if (audioInitialized && incomingNote !== "") {
                    // Compara la nota recibida con la nota asignada a este teléfono
                    if (Number(incomingNote) === Number(assignedMidiNote)) {
                        playAssignedNote();
                    } else {
                        log.innerText = `MIDI ${incomingNote} (No es tu nota)`;
                    }
                }
            } catch (err) {
                console.error("Error al procesar mensaje:", err);
            }
        };
    </script>
</body>
</html>
