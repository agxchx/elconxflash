<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orquesta Dm11 - Teléfono</title>
    <!-- Cargamos Tone.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
        }
        .btn-main {
            padding: 20px 35px;
            font-size: 20px;
            background-color: #ef4444;
            color: #ffffff;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            margin-bottom: 15px;
        }
        .btn-test {
            padding: 12px 25px;
            font-size: 16px;
            background-color: #3b82f6;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            display: none; /* Se oculta hasta que actives el audio */
            margin-top: 15px;
        }
        #info {
            margin-top: 20px;
            font-size: 30px;
            color: #38bdf8;
            font-weight: bold;
        }
        #log {
            margin-top: 15px;
            font-size: 16px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div>
        <h2>Orquesta Web Dm11</h2>
        
        <!-- Botón principal para destrabar el audio del navegador -->
        <button id="start" class="btn-main">1. TOCA AQUÍ PARA ACTIVAR</button>
        
        <div id="info">Nota: ?</div>
        
        <!-- Botón de prueba manual de sonido -->
        <button id="test-sound" class="btn-test">🎵 Tocar mi nota de prueba</button>
        
        <p id="log">Esperando activación de audio...</p>
    </div>

    <script>
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}`);
        const log = document.getElementById('log');
        const info = document.getElementById('info');
        const testBtn = document.getElementById('test-sound');

        // Notas del acorde Dm11 (D, F, A, C, G)
        const dm11Notes = [50, 53, 57, 60, 67, 62, 65, 69, 72, 79];
        const randomMidiNote = dm11Notes[Math.floor(Math.random() * dm11Notes.length)];

        function midiToNoteName(midiNumber) {
            const notes = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
            const octave = Math.floor(midiNumber / 12) - 1;
            return notes[midiNumber % 12] + octave;
        }

        const assignedNoteString = midiToNoteName(randomMidiNote);
        info.innerText = `Tu Nota: ${assignedNoteString}`;

        let synth;
        let audioInitialized = false;

        function playAssignedNote() {
            if (audioInitialized && synth) {
                synth.triggerAttackRelease(assignedNoteString, "4n");
                log.innerText = `¡Sonando nota ${assignedNoteString}!`;
                setTimeout(() => {
                    log.innerText = "Conectado. ¡Listo para recibir señal MIDI!";
                }, 400);
            }
        }

        // 1. Activar motor de audio con el botón rojo
        document.getElementById('start').addEventListener('click', async () => {
            await Tone.start();
            
            synth = new Tone.FMSynth({
                harmonicity: 1.5,
                modulationIndex: 1.2,
                oscillator: { type: "triangle" },
                envelope: { attack: 0.01, decay: 0.5, sustain: 0, release: 0.5 },
                modulation: { type: "square" },
                modulationEnvelope: { attack: 0.01, decay: 0.3, sustain: 0, release: 0.3 }
            }).toDestination();

            audioInitialized = true;
            
            // Cambiar estilos de interfaz
            const btn = document.getElementById('start');
            btn.style.backgroundColor = "#22c55e";
            btn.innerText = "¡AUDIO ACTIVO!";
            btn.disabled = true;
            
            testBtn.style.display = "inline-block"; // Mostrar el botón de prueba azul
            log.innerText = "Audio desbloqueado. ¡Prueba el botón azul o tu controlador MIDI!";
            
            playAssignedNote(); // Toque inicial de confirmación
        });

        // 2. Botón de prueba manual en pantalla
        testBtn.addEventListener('click', () => {
            playAssignedNote();
        });

        // 3. Recepción de señal MIDI remota desde el servidor
        ws.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                console.log("Mensaje recibido:", data);
                
                if (data.note || data.type === 'play' || data.type === 'flash') {
                    if (audioInitialized) {
                        playAssignedNote();
                    } else {
                        log.innerText = "⚠️ ¡Llegó señal MIDI, pero debes tocar el botón rojo primero!";
                    }
                }
            } catch (e) {
                console.error("Error al procesar mensaje:", e);
            }
        };
    </script>
</body>
</html>
