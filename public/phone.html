<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orquesta Dm11 - Delay</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
        }
        .btn-main {
            padding: 20px 35px;
            font-size: 20px;
            background-color: #ef4444;
            color: #ffffff;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            margin-bottom: 15px;
        }
        .btn-test {
            padding: 12px 25px;
            font-size: 16px;
            background-color: #3b82f6;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            display: none;
            margin-top: 15px;
        }
        #info {
            margin-top: 20px;
            font-size: 24px;
            color: #38bdf8;
            font-weight: bold;
        }
        #debug {
            margin-top: 10px;
            font-size: 16px;
            color: #fbbf24;
        }
        #log {
            margin-top: 15px;
            font-size: 16px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div>
        <h2>Orquesta Web Dm11 + Delay</h2>
        <button id="start" class="btn-main">1. TOCA AQUÍ PARA ACTIVAR</button>
        <div id="info">Notas asignadas: ?</div>
        <div id="debug">Último MIDI recibido: Ninguno</div>
        <button id="test-sound" class="btn-test">🎵 Tocar mi trío de prueba</button>
        <p id="log">Esperando activación de audio...</p>
    </div>

    <script>
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}`);
        const log = document.getElementById('log');
        const info = document.getElementById('info');
        const debug = document.getElementById('debug');
        const testBtn = document.getElementById('test-sound');

        // Banco de tríos armónicos de Dm11 entre A1 (33) y D4 (62)
        const dm11Trios = [
            [33, 41, 48], // A1, F2, C3
            [36, 45, 53], // C2, A2, F3
            [38, 48, 55], // D2, C3, G3
            [41, 50, 57], // F2, D3, A3
            [45, 53, 60], // A2, F3, C4
            [50, 57, 62]  // D3, A3, D4
        ];

        const assignedTrioMidi = dm11Trios[Math.floor(Math.random() * dm11Trios.length)];

        function midiToNoteName(midiNumber) {
            const notes = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
            const octave = Math.floor(midiNumber / 12) - 1;
            return notes[midiNumber % 12] + octave;
        }

        const assignedTrioNames = assignedTrioMidi.map(midiToNoteName);
        info.innerText = `Notas: ${assignedTrioNames.join(' - ')}`;

        let synth;
        let delayEffect;
        let audioInitialized = false;

        function playAssignedTrio() {
            if (audioInitialized && synth) {
                assignedTrioNames.forEach((noteName, index) => {
                    setTimeout(() => {
                        synth.triggerAttackRelease(noteName, "8n");
                    }, index * 90);
                });

                log.innerText = `¡Sonó el trío con Delay (${assignedTrioNames.join(', ')})!`;
                setTimeout(() => {
                    log.innerText = "Conectado. Esperando tus notas MIDI...";
                }, 500);
            }
        }

        document.getElementById('start').addEventListener('click', async () => {
            await Tone.start();
            
            // 1. Configuramos el Delay con las características de tu imagen:
            // "8t" = 1/8 triplet (tresillo de corchea)
            // Feedback = 0.57 (57%)
            // Wet = 1.0 (100%), Dry = 0.0 (0%)
            delayEffect = new Tone.FeedbackDelay({
                delayTime: "8t",
                feedback: 0.57,
                wet: 1.0
            }).toDestination();

            // 2. Creamos el sintetizador y lo conectamos directamente al Delay
            synth = new Tone.FMSynth({
                harmonicity: 1.5,
                modulationIndex: 1.2,
                oscillator: { type: "triangle" },
                envelope: { attack: 0.01, decay: 0.4, sustain: 0, release: 0.3 },
                modulation: { type: "square" },
                modulationEnvelope: { attack: 0.01, decay: 0.2, sustain: 0, release: 0.2 }
            }).connect(delayEffect);

            audioInitialized = true;
            
            const btn = document.getElementById('start');
            btn.style.backgroundColor = "#22c55e";
            btn.innerText = "¡AUDIO Y DELAY ACTIVOS!";
            btn.disabled = true;
            
            testBtn.style.display = "inline-block";
            log.innerText = "Audio desbloqueado. ¡Listo!";
            
            playAssignedTrio();
        });

        testBtn.addEventListener('click', () => {
            playAssignedTrio();
        });

        ws.onmessage = async (event) => {
            try {
                let incomingNote = null;

                if (event.data instanceof Blob) {
                    incomingNote = await event.data.text();
                } else {
                    incomingNote = String(event.data);
                }

                incomingNote = incomingNote.trim();
                debug.innerText = `Último MIDI recibido: ${incomingNote}`;

                if (audioInitialized && incomingNote !== "") {
                    if (assignedTrioMidi.includes(Number(incomingNote))) {
                        playAssignedTrio();
                    } else {
                        log.innerText = `MIDI ${incomingNote} (Fuera de tu trío)`;
                    }
                }
            } catch (err) {
                console.error("Error al procesar mensaje:", err);
            }
        };
    </script>
</body>
</html>
