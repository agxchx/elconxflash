<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receptor de Vibración MIDI</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #111;
            color: white;
            font-family: sans-serif;
            text-align: center;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            background-color: #00ffcc;
            color: #000;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        #log {
            margin-top: 20px;
            font-size: 16px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div>
        <h2>Receptor Háptico MIDI</h2>
        <button id="start">Activar Receptor</button>
        <p id="log">Esperando interacción inicial...</p>
    </div>

    <script>
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}`);
        const log = document.getElementById('log');

        // Los navegadores móviles exigen una interacción táctil previa para habilitar funciones de hardware
        document.getElementById('start').addEventListener('click', () => {
            if ("vibrate" in navigator) {
                // Vibración de prueba para confirmar permisos
                navigator.vibrate(100);
                log.innerText = "¡Listo! Escuchando señales MIDI...";
                document.getElementById('start').style.display = 'none';
            } else {
                log.innerText = "Tu navegador no soporta vibración.";
            }
        });

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === 'flash') { // Mantenemos el tipo 'flash' para que coincida con el emisor
                log.innerText = `¡Pulso recibido (Nota: ${data.note})!`;
                
                // Dispara una vibración de 150 milisegundos
                if ("vibrate" in navigator) {
                    navigator.vibrate(150);
                }
            }
        };
    </script>
</body>
</html>
