<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orquesta Dm11 - Teléfono</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
        }
        button {
            padding: 20px 40px;
            font-size: 20px;
            background-color: #10b981;
            color: #ffffff;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }
        #info {
            margin-top: 25px;
            font-size: 28px;
            color: #38bdf8;
            font-weight: bold;
        }
        #log {
            margin-top: 15px;
            font-size: 16px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div>
        <h2>Orquesta Web Dm11</h2>
        <button id="start">Unirse a la Orquesta</button>
        <div id="info">Nota: ?</div>
        <p id="log">Toca el botón para activar el audio...</p>
    </div>

    <script>
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}`);
        const log = document.getElementById('log');
        const info = document.getElementById('info');

        // Notas del acorde Dm11 (D, F, A, C, G)
        const dm11Notes = [50, 53, 57, 60, 67, 62, 65, 69, 72, 79];
        const randomMidiNote = dm11Notes[Math.floor(Math.random() * dm11Notes.length)];

        function midiToNoteName(midiNumber) {
            const notes = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
            const octave = Math.floor(midiNumber / 12) - 1;
            return notes[midiNumber % 12] + octave;
        }

        const assignedNoteString = midiToNoteName(randomMidiNote);
        info.innerText = `Tu Nota: ${assignedNoteString}`;

        const synth = new Tone.Synth({
            oscillator: { type: "sine" },
            envelope: { attack: 0.005, decay: 0.4, sustain: 0, release: 0.3 }
        }).toDestination();

        document.getElementById('start').addEventListener('click', async () => {
            await Tone.start();
            log.innerText = "¡Audio activado! Esperando notas...";
            document.getElementById('start').style.display = 'none';
        });

        ws.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                // Si llega cualquier mensaje válido del controlador
                if (data.note) {
                    synth.triggerAttackRelease(assignedNoteString, "4n");
                    log.innerText = `¡Tocando ${assignedNoteString}! (MIDI ${data.note})`;
                    setTimeout(() => {
                        log.innerText = "Esperando notas...";
                    }, 300);
                }
            } catch (e) {
                console.error("Error leyendo mensaje:", e);
            }
        };
    </script>
</body>
</html>
