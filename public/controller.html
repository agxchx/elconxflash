<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controlador MIDI Orquesta</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #fff; padding: 30px; text-align: center; }
        .box { background: #1e293b; padding: 20px; border-radius: 12px; margin: 20px auto; max-width: 400px; text-align: left; }
        #status { font-weight: bold; color: #ef4444; }
        #status.ok { color: #22c55e; }
        #monitor { color: #38bdf8; text-align: center; font-size: 20px; margin-top: 10px; }
    </style>
</head>
<body>
    <h2>Controlador Maestro Orquesta</h2>
    <div class="box">
        <p>Estado del Servidor: <span id="status">Desconectado</span></p>
        <p id="midi-info">Buscando controlador MIDI...</p>
        <hr style="border: 0; border-top: 1px solid #334155; margin: 15px 0;">
        <div id="monitor">Esperando nota...</div>
    </div>

    <script>
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}`);
        const statusEl = document.getElementById('status');
        const midiInfo = document.getElementById('midi-info');
        const monitor = document.getElementById('monitor');

        ws.onopen = () => {
            statusEl.innerText = "Conectado";
            statusEl.classList.add('ok');
        };

        ws.onclose = () => {
            statusEl.innerText = "Desconectado";
            statusEl.classList.remove('ok');
        };

        if (navigator.requestMIDIAccess) {
            navigator.requestMIDIAccess().then(onMIDISuccess, onMIDIFailure);
        } else {
            midiInfo.innerText = "Web MIDI no soportado en este navegador.";
        }

        function onMIDISuccess(midiAccess) {
            let count = 0;
            for (let input of midiAccess.inputs.values()) {
                input.onmidimessage = getMIDIMessage;
                count++;
            }
            midiInfo.innerText = count > 0 ? `¡Controlador conectado (${count})!` : "⚠️ No hay dispositivos MIDI conectados.";
        }

        function onMIDIFailure() {
            midiInfo.innerText = "Error al conectar con Web MIDI.";
        }

        function getMIDIMessage(message) {
            const [command, note, velocity] = message.data;
            
            // Detectar Note On (comandos entre 144 y 159) con velocidad mayor a 0
            if ((command & 0xf0) === 144 && velocity > 0) {
                console.log("Enviando Nota MIDI:", note);
                monitor.innerText = `¡Nota Enviada: ${note}!`;
                
                // Enviar el número de nota directamente como texto plano para máxima compatibilidad
                if (ws.readyState === WebSocket.OPEN) {
                    ws.send(String(note));
                }
            }
        }
    </script>
</body>
</html>
