<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control Orquesta MIDI</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
        }
        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
            text-align: left;
        }
        h2 { margin-top: 0; color: #38bdf8; }
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #ef4444;
            margin-right: 8px;
        }
        .status-indicator.connected {
            background-color: #22c55e;
        }
        pre {
            background: #0f172a;
            padding: 10px;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 14px;
            color: #38bdf8;
        }
        #flash-indicator {
            width: 100%;
            height: 50px;
            background-color: #334155;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            transition: background-color 0.05s ease;
        }
    </style>
</head>
<body>

    <h2>Controlador Maestro Orquesta</h2>

    <div class="card">
        <h3>Estado de Red (Servidor)</h3>
        <p><span id="ws-status-dot" class="status-indicator"></span><span id="ws-status-text">Desconectado del servidor</span></p>
    </div>

    <div class="card">
        <h3>Dispositivos MIDI Detectados</h3>
        <pre id="midi-devices">Buscando controladores MIDI...</pre>
    </div>

    <div class="card">
        <h3>Monitor de Señal de Salida</h3>
        <div id="flash-indicator">Esperando toque de tecla...</div>
        <p id="last-msg" style="color: #94a3b8; font-size: 14px; margin-top: 10px;">Última nota enviada: Ninguna</p>
    </div>

    <script>
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}`);
        
        const wsDot = document.getElementById('ws-status-dot');
        const wsText = document.getElementById('ws-status-text');
        const midiDevicesPre = document.getElementById('midi-devices');
        const flashIndicator = document.getElementById('flash-indicator');
        const lastMsg = document.getElementById('last-msg');

        // Control de WebSocket
        ws.onopen = () => {
            wsDot.classList.add('connected');
            wsText.innerText = "Conectado al servidor en la nube";
        };

        ws.onclose = () => {
            wsDot.classList.remove('connected');
            wsText.innerText = "Desconectado del servidor";
        };

        // Control de Web MIDI API
        if (navigator.requestMIDIAccess) {
            navigator.requestMIDIAccess().then(onMIDISuccess, onMIDIFailure);
        } else {
            midiDevicesPre.innerText = "Tu navegador no soporta Web MIDI. Usa Google Chrome o Edge en la PC.";
        }

        function onMIDISuccess(midiAccess) {
            updateDeviceList(midiAccess);
            
            // Escuchar si se conectan o desconectan dispositivos en caliente
            midiAccess.onstatechange = (e) => {
                updateDeviceList(midiAccess);
            };

            for (let input of midiAccess.inputs.values()) {
                input.onmidimessage = getMIDIMessage;
            }
        }

        function onMIDIFailure() {
            midiDevicesPre.innerText = "No se pudo acceder a los puertos MIDI.";
        }

        function updateDeviceList(midiAccess) {
            let devices = [];
            for (let input of midiAccess.inputs.values()) {
                devices.push(`✅ Entrada: ${input.name} (Fabricante: ${input.manufacturer || 'Desconocido'})`);
            }
            if (devices.length === 0) {
                midiDevicesPre.innerText = "⚠️ No hay ningún controlador MIDI conectado por USB/Bluetooth.";
            } else {
                midiDevicesPre.innerText = devices.join('\n');
            }
        }

        function getMIDIMessage(message) {
            const [command, note, velocity] = message.data;
            
            // Nota activada (Note On, comando típico 144 a 159 según canal) con velocidad > 0
            if ((command & 0xf0) === 144 && velocity > 0) {
                console.log(`MIDI Recibido -> Nota: ${note}, Velocidad: ${velocity}`);
                
                // 1. Mostrar en pantalla de la PC que la señal llegó del controlador
                flashIndicator.style.backgroundColor = "#22c55e";
                flashIndicator.innerText = `¡SEÑAL ENVIADA! (Nota MIDI: ${note})`;
                lastMsg.innerText = `Última nota enviada: ${note} | Canal: ${command & 0x0f} | Vel: ${velocity}`;

                setTimeout(() => {
                    flashIndicator.style.backgroundColor = "#334155";
                    flashIndicator.innerText = "Esperando toque de tecla...";
                }, 150);

                // 2. Enviar por WebSocket a los teléfonos conectados
                if (ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'flash', note: note }));
                }
            }
        }
    </script>
</body>
</html>
